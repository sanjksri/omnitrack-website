name: mobile_tracker
description: "Device tracking app transmitting GPS coordinates to Firebase Firestore"
publish_to: 'none'
version: 1.0.3+6

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Firebase
  firebase_core: ^2.27.0
  cloud_firestore: ^4.15.5

  # Location & Background Service
  geolocator: ^10.1.0
  flutter_background_service: ^5.0.0
  flutter_local_notifications: ^17.0.0
  permission_handler: ^11.3.0

  # Storage & Utilities
  shared_preferences: ^2.2.2
  intl: ^0.20.3
  url_launcher: ^6.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png

