<!doctype html><html><body style="margin:0;background:#000">
<canvas id="c" width="1200" height="1080"></canvas>
<script>
const c = document.getElementById('c'), x = c.getContext('2d');
const W = c.width, H = c.height;
const T = 8;              // loop seconds
const SPEED = 12;         // mean m/s -> 96 m per loop
const SURGE = 1.6;        // m/s swing: the van accelerates, then eases off, once per loop
const LAG = 0.9;          // camera car follows the van's speed changes with a lag (radians of the loop)
const K = SURGE * T / (2 * Math.PI);
// distance travelled by the van and by the camera car (both exactly 96 m per loop -> seamless)
const vanDist = (t) => SPEED * t + K * (1 - Math.cos(2 * Math.PI * t / T));
const camDist = (t) => SPEED * t + K * (Math.cos(-LAG) - Math.cos(2 * Math.PI * t / T - LAG));
const vanSpeed = (t) => SPEED + SURGE * Math.sin(2 * Math.PI * t / T);
const vanAccel = (t) => SURGE * (2 * Math.PI / T) * Math.cos(2 * Math.PI * t / T);
// wheel radius chosen so the 5-lug hub returns to the same angle after 96 m
const WHEEL_R = 96 * 5 / (2 * Math.PI * 225);
const DASH_P = 12, DASH_L = 4, POST_P = 24;
const HY = H * 0.44;      // horizon
const CAM_H = 1.5, F = W * 0.95;
const CX = W * 0.64;      // road vanishing x (right of centre: the van sits clear of the phone)
const TAU = Math.PI * 2;

function mix(a, b, t) { return a.map((v, i) => Math.round(v + (b[i] - v) * t)); }
function rgb(a, al = 1) { return `rgba(${a[0]},${a[1]},${a[2]},${al})`; }
const HAZE = [206, 186, 146];
const SUN_X = W * 0.8;

function hillLine(seed, amp, base, freq, drift) {
  const pts = [];
  for (let px = -20; px <= W + 20; px += 6) {
    const u = (px + drift) / W;
    let y = 0;
    y += Math.sin(u * TAU * freq + seed) * 0.55;
    y += Math.sin(u * TAU * freq * 2.3 + seed * 1.7) * 0.28;
    y += Math.sin(u * TAU * freq * 5.1 + seed * 0.3) * 0.12;
    pts.push([px, base - amp * (0.6 + y * 0.5)]);
  }
  return pts;
}

function draw(t) {
  const ph = (t % T) / T;
  const curve = 0.00055 * Math.sin(ph * TAU);           // road bend
  const camX = -0.15 * Math.sin(ph * TAU);
  const bob = Math.sin(ph * TAU * 4) * 1.2;
  const hy = HY + bob;

  const proj = (wx, z) => {
    const lat = wx + curve * z * z - camX;
    return [CX + F * lat / z, hy + F * CAM_H / z];
  };

  // sky
  let g = x.createLinearGradient(0, 0, 0, hy);
  g.addColorStop(0, '#16302a');
  g.addColorStop(0.42, '#3c5546');
  g.addColorStop(0.74, '#9a9670');
  g.addColorStop(0.93, '#dcc28e');
  g.addColorStop(1, '#efd6a4');
  x.fillStyle = g; x.fillRect(0, 0, W, hy + 2);
  // low sun glow
  const sg = x.createRadialGradient(SUN_X, hy - 14, 0, SUN_X, hy - 14, W * 0.5);
  sg.addColorStop(0, 'rgba(255,230,178,0.8)'); sg.addColorStop(0.08, 'rgba(244,206,140,0.5)'); sg.addColorStop(0.4, 'rgba(216,165,79,0.16)'); sg.addColorStop(1, 'rgba(216,165,79,0)');
  x.fillStyle = sg; x.fillRect(0, 0, W, hy + 2);

  // high cirrus, lit warm from below by the low sun; drifts on the loop so it never seams
  x.save();
  x.filter = 'blur(10px)';
  const cdrift = Math.sin(ph * TAU) * 6;
  for (const [cx0, cy0, rw, rh, al] of [[0.22, 0.12, 300, 9, 0.16], [0.62, 0.2, 380, 7, 0.2], [0.9, 0.3, 260, 6, 0.22], [0.4, 0.31, 200, 5, 0.14]]) {
    x.fillStyle = `rgba(236,206,152,${al})`;
    x.beginPath(); x.ellipse(W * cx0 + cdrift, hy - (0.44 - cy0) * H, rw, rh, -0.02, 0, TAU); x.fill();
  }
  x.restore();

  // hills (far to near)
  const drift = Math.sin(ph * TAU) * 40;
  const layers = [
    { seed: 1.3, amp: 70, base: hy + 2, freq: 1.6, col: mix([108, 120, 96], HAZE, 0.5), d: drift * 0.3 },
    { seed: 4.1, amp: 95, base: hy + 4, freq: 1.1, col: mix([70, 92, 72], HAZE, 0.22), d: drift * 0.6 },
    { seed: 2.2, amp: 60, base: hy + 6, freq: 2.2, col: [40, 64, 48], d: drift },
  ];
  for (const L of layers) {
    const p = hillLine(L.seed, L.amp, L.base, L.freq, L.d);
    x.beginPath(); x.moveTo(-20, H);
    p.forEach(([a, b]) => x.lineTo(a, b));
    x.lineTo(W + 20, H); x.closePath();
    const hg = x.createLinearGradient(0, L.base - L.amp * 1.2, 0, L.base + 4);
    hg.addColorStop(0, rgb(L.col)); hg.addColorStop(1, rgb(mix(L.col, HAZE, 0.35)));
    x.fillStyle = hg; x.fill();
  }

  // ground
  g = x.createLinearGradient(0, hy, 0, H);
  g.addColorStop(0, '#77754f'); g.addColorStop(0.08, '#4f5c3e'); g.addColorStop(0.3, '#2d4433'); g.addColorStop(1, '#13231a');
  x.fillStyle = g; x.fillRect(0, hy + 4, W, H - hy);
  // distant tree line along the horizon
  x.fillStyle = 'rgba(36,56,42,0.95)';
  for (let px = -10; px < W + 10; px += 7) {
    const u = (px + drift * 1.2) / W;
    const hgt = 6 + 5 * (Math.sin(u * 91.7) * 0.5 + 0.5) + 4 * (Math.sin(u * 23.3 + 1.1) * 0.5 + 0.5);
    x.beginPath(); x.ellipse(px, hy + 6, 6, hgt, 0, Math.PI, TAU); x.fill();
  }
  x.fillRect(0, hy + 5, W, 4);
  // field furrows: faint lines converging to the vanishing point
  x.strokeStyle = 'rgba(12,24,16,0.18)'; x.lineWidth = 1.2;
  for (let k = -14; k <= 14; k++) {
    if (Math.abs(k) < 2) continue;
    const a = proj(k * 6.5, 400), bb = proj(k * 6.5, 2.2);
    x.beginPath(); x.moveTo(...a); x.lineTo(...bb); x.stroke();
  }


  // road as continuous strips (no seams); fog via vertical gradient
  const zs = [];
  for (let z = 700; z > 1.4; z *= 0.985) zs.push(z);
  const fogGrad = (col) => {
    const gr = x.createLinearGradient(0, hy, 0, H);
    for (let k = 0; k <= 12; k++) {
      const y = hy + 1 + (H - hy) * Math.pow(k / 12, 2.2);
      const z = F * CAM_H / Math.max(0.5, y - hy);
      const fog = 1 - Math.exp(-z / 260);
      gr.addColorStop(Math.min(1, (y - hy) / (H - hy)), rgb(mix(col, HAZE, fog * 0.85)));
    }
    return gr;
  };
  const strip = (a, b, col) => {
    x.beginPath();
    zs.forEach((z, i) => { const p = proj(a, z); i ? x.lineTo(...p) : x.moveTo(...p); });
    for (let i = zs.length - 1; i >= 0; i--) x.lineTo(...proj(b, zs[i]));
    x.closePath(); x.fillStyle = fogGrad(col); x.fill();
  };
  strip(-5.4, 5.4, [92, 94, 78]);
  strip(-3.7, 3.7, [48, 51, 48]);
  for (const c0 of [-2.7, -1.0, 1.0, 2.7]) strip(c0 - 0.35, c0 + 0.35, [40, 43, 41]);
  strip(-3.55, -3.42, [214, 210, 196]);
  strip(3.42, 3.55, [214, 210, 196]);
  // low sun glinting off the asphalt toward the vanishing point
  x.save();
  x.globalCompositeOperation = 'screen';
  const vp = proj(0, 600);
  const sheen = x.createRadialGradient(vp[0], vp[1], 0, vp[0], vp[1] + 40, 360);
  sheen.addColorStop(0, 'rgba(240,206,146,0.42)'); sheen.addColorStop(0.35, 'rgba(200,160,100,0.12)'); sheen.addColorStop(1, 'rgba(200,160,100,0)');
  x.fillStyle = sheen; x.fillRect(0, hy, W, H - hy);
  x.restore();

  // centre dashes
  const cd = camDist(t);
  const blur = (SPEED + SURGE) / 60;   // half a 30 fps frame of travel
  const off = cd % DASH_P;
  for (let k = 0; k < 60; k++) {
    const z0 = k * DASH_P - off + 1.5 - blur, z1 = z0 + DASH_L + blur;
    if (z1 < 1.5 || z0 > 650) continue;
    const za = Math.max(1.5, z0);
    const p0 = proj(-0.07, z1), p1 = proj(0.07, z1), p2 = proj(0.07, za), p3 = proj(-0.07, za);
    const fog = 1 - Math.exp(-za / 260);
    x.beginPath(); x.moveTo(...p0); x.lineTo(...p1); x.lineTo(...p2); x.lineTo(...p3); x.closePath();
    x.fillStyle = rgb(mix([226, 206, 156], HAZE, fog * 0.85)); x.fill();
  }

  // reflector posts
  for (let k = 0; k < 40; k++) {
    const z = POST_P * k - cd % POST_P + 3;
    if (z < 2.2 || z > 620) continue;
    for (const side of [-6, 6]) {
      const [px, py] = proj(side, z);
      const h = F * 1.0 / z, w = Math.max(1, F * 0.11 / z);
      const fog = 1 - Math.exp(-z / 260);
      x.fillStyle = rgb(mix([226, 222, 210], HAZE, fog * 0.9));
      x.fillRect(px - w / 2, py - h, w, h);
      x.fillStyle = rgb(mix([216, 150, 60], HAZE, fog * 0.9));
      x.fillRect(px - w / 2, py - h, w, h * 0.16);
    }
  }

  // ---------- van: a 3D box in the same camera as the road ----------
  const P3 = (wx, wy, z) => [CX + F * (wx + curve * z * z - camX) / z, hy + F * (CAM_H - wy) / z];
  const gap = 11 + vanDist(t) - camDist(t);          // metres from camera to the van's rear
  const Z = gap, LEN = 5.0, HW = 0.95;
  const lane = -1.85 + Math.sin(ph * TAU * 3) * 0.04;  // small steering corrections
  const acc = vanAccel(t);
  const bump = 0.010 * Math.sin(ph * TAU * 9) + 0.006 * Math.sin(ph * TAU * 14 + 1.3);
  const squat = -0.012 * acc;                          // rear sinks a little under acceleration
  const lift = 0.36 + bump + squat;
  const roll = -curve * 36;                            // body leans out of the bend (about 1 degree at most)
  const xL = lane - HW, xR = lane + HW, yB = lift, yT = 2.22 + bump + squat;
  const rB = (wx, wy, z) => {                          // apply roll about the body's centre line
    const dx = wx - lane, dy = wy - yB;
    return P3(lane + dx * Math.cos(roll) - dy * Math.sin(roll), yB + dx * Math.sin(roll) + dy * Math.cos(roll), z);
  };
  const brake = Math.max(0, Math.min(1, (-acc - 0.25) / 0.8));

  // long soft shadow: the low sun ahead throws it back toward the camera
  x.save();
  x.filter = `blur(${Math.max(2, F * 0.06 / Z)}px)`;
  x.fillStyle = 'rgba(8,16,11,0.55)';
  const sh = [P3(xL - 0.15, 0, Z - 2.2), P3(xR - 0.35, 0, Z - 2.2), P3(xR + 0.05, 0, Z + LEN), P3(xL - 0.05, 0, Z + LEN)];
  x.beginPath(); sh.forEach((p, i) => i ? x.lineTo(...p) : x.moveTo(...p)); x.closePath(); x.fill();
  x.restore();
  // contact shadow: ambient occlusion right under the body, so it sits on the road
  x.save();
  x.filter = `blur(${Math.max(1.5, F * 0.025 / Z)}px)`;
  x.fillStyle = 'rgba(4,8,6,0.78)';
  const ao = [P3(xL - 0.04, 0, Z + 0.15), P3(xR + 0.06, 0, Z + 0.15), P3(xR + 0.06, 0, Z + LEN - 0.3), P3(xL - 0.04, 0, Z + LEN - 0.3)];
  x.beginPath(); ao.forEach((p, i) => i ? x.lineTo(...p) : x.moveTo(...p)); x.closePath(); x.fill();
  x.restore();

  // tail-light reflections on the asphalt (stronger when braking)
  x.save();
  x.filter = 'blur(6px)';
  for (const lx of [xL + 0.12, xR - 0.12]) {
    const [rx, ry] = P3(lx, 0, Z - 0.6);
    x.fillStyle = `rgba(214,86,52,${0.05 + 0.12 * brake})`;
    x.beginPath(); x.ellipse(rx, ry, F * 0.08 / Z, F * 0.28 / Z, 0, 0, TAU); x.fill();
  }
  x.restore();

  // rear wheels, seen under the bumper
  x.fillStyle = '#0d1210';
  for (const wx of [xL + 0.18, xR - 0.18]) {
    const a1 = P3(wx - 0.13, 0.62, Z + 0.9), a2 = P3(wx + 0.13, 0, Z + 0.9);
    x.beginPath(); x.roundRect(a1[0], a1[1], a2[0] - a1[0], a2[1] - a1[1], (a2[0] - a1[0]) * 0.35); x.fill();
  }

  // right side panel (we see it from behind-right): lit warm by the low sun
  const side = [rB(xR, yB, Z), rB(xR, yB, Z + LEN), rB(xR, yT, Z + LEN), rB(xR, yT, Z)];
  let sg2 = x.createLinearGradient(side[0][0], 0, side[1][0], 0);
  sg2.addColorStop(0, '#d9cfb8'); sg2.addColorStop(1, '#c2b79d');
  x.beginPath(); side.forEach((p, i) => i ? x.lineTo(...p) : x.moveTo(...p)); x.closePath();
  x.fillStyle = sg2; x.fill();
  const quad = (pts, fill) => { x.beginPath(); pts.forEach((p, i) => i ? x.lineTo(...p) : x.moveTo(...p)); x.closePath(); x.fillStyle = fill; x.fill(); };
  quad([rB(xR, 1.02 + bump + squat, Z), rB(xR, 1.02 + bump + squat, Z + LEN), rB(xR, 1.16 + bump + squat, Z + LEN), rB(xR, 1.16 + bump + squat, Z)], '#1d4a36');
  quad([rB(xR, 1.45 + bump, Z + 3.95), rB(xR, 1.45 + bump, Z + 4.75), rB(xR, 2.0 + bump, Z + 4.6), rB(xR, 2.0 + bump, Z + 3.95)], '#1a2620');
  quad([rB(xR, yB, Z), rB(xR, yB, Z + LEN), rB(xR, yB + 0.12, Z + LEN), rB(xR, yB + 0.12, Z)], 'rgba(20,24,20,0.55)');

  // side wheels: tyre, hub, and five lugs that turn with the distance travelled
  const spin = vanDist(t) / WHEEL_R;
  for (const wz of [Z + 0.9, Z + 4.05]) {
    const c0 = P3(xR + 0.02, WHEEL_R, wz);
    const ry = F * WHEEL_R / wz;
    const rx = Math.abs(P3(xR + 0.02, WHEEL_R, wz + WHEEL_R)[0] - P3(xR + 0.02, WHEEL_R, wz - WHEEL_R)[0]) / 2;
    x.fillStyle = '#1a201d'; x.beginPath(); x.ellipse(c0[0], c0[1], rx * 1.25 + 1, ry * 1.12, 0, Math.PI, TAU); x.fill(); // arch
    x.fillStyle = '#0e1311'; x.beginPath(); x.ellipse(c0[0], c0[1], rx + 0.8, ry, 0, 0, TAU); x.fill();
    x.fillStyle = '#6d6f68'; x.beginPath(); x.ellipse(c0[0], c0[1], rx * 0.56 + 0.4, ry * 0.56, 0, 0, TAU); x.fill();
    x.fillStyle = '#2d302d';
    for (let k = 0; k < 5; k++) {
      const th = spin + k * TAU / 5;
      const lp = P3(xR + 0.03, WHEEL_R + 0.13 * Math.sin(th), wz + 0.13 * Math.cos(th));
      x.beginPath(); x.ellipse(lp[0], lp[1], Math.max(0.6, rx * 0.12), Math.max(0.8, ry * 0.1), 0, 0, TAU); x.fill();
    }
  }

  // rear face: drawn in its own 0..100 space, mapped onto the projected face (handles scale, lean and roll)
  const TL = rB(xL, yT, Z), TR = rB(xR, yT, Z), BL = rB(xL, yB, Z);
  x.save();
  x.setTransform((TR[0] - TL[0]) / 100, (TR[1] - TL[1]) / 100, (BL[0] - TL[0]) / 100, (BL[1] - TL[1]) / 100, TL[0], TL[1]);
  const body = x.createLinearGradient(0, 0, 0, 100);
  body.addColorStop(0, '#c9c2b1'); body.addColorStop(0.5, '#a9a291'); body.addColorStop(1, '#6f6a5e');   // backlit: the sun is ahead
  x.fillStyle = body; x.beginPath(); x.roundRect(0, 0, 100, 100, [7, 7, 2, 2]); x.fill();
  x.fillStyle = 'rgba(255,226,170,0.8)'; x.fillRect(4, 0, 92, 1.8);           // warm rim light on the roof edge
  x.fillStyle = 'rgba(255,226,170,0.5)'; x.fillRect(98.2, 4, 1.8, 74);       // and down the sunlit edge
  x.fillStyle = '#18231d';
  x.beginPath(); x.roundRect(7, 9, 39, 25, 2.5); x.fill();
  x.beginPath(); x.roundRect(54, 9, 39, 25, 2.5); x.fill();
  x.fillStyle = 'rgba(214,190,140,0.22)'; x.fillRect(9, 11, 11, 20);          // sky reflection in the glass
  x.fillStyle = 'rgba(40,40,34,0.55)'; x.fillRect(49.6, 5, 0.8, 80);          // door split
  x.fillStyle = '#1d4a36'; x.fillRect(0, 50, 100, 6.5);                         // fleet stripe
  x.fillStyle = '#1d4a36'; x.font = '700 12px Arial, sans-serif'; x.textAlign = 'center'; x.textBaseline = 'middle';
  x.fillText('04', 73, 43);
  x.fillStyle = '#e2b83c'; x.fillRect(35, 66, 30, 9.5);                         // yellow commercial plate
  x.fillStyle = 'rgba(30,30,20,0.75)'; x.fillRect(39, 69.6, 22, 2.4);
  x.fillStyle = '#262b28'; x.fillRect(-1.5, 86, 103, 14);                       // bumper
  x.fillStyle = 'rgba(0,0,0,0.25)'; x.fillRect(0, 80, 100, 6);                  // ambient occlusion above bumper
  x.restore();

  // tail lights, glowing in screen space; brighter while the van is slowing
  const lamp = (u0, u1, v0, v1) => {
    const pA = [TL[0] + (TR[0] - TL[0]) * u0 + (BL[0] - TL[0]) * v0, TL[1] + (TR[1] - TL[1]) * u0 + (BL[1] - TL[1]) * v0];
    const w = (TR[0] - TL[0]) * (u1 - u0), h = (BL[1] - TL[1]) * (v1 - v0);
    x.save();
    x.shadowColor = `rgba(240,90,55,${0.55 + 0.45 * brake})`; x.shadowBlur = w * (1.6 + 2.2 * brake);
    x.fillStyle = brake > 0.05 ? `rgb(${236},${Math.round(92 - 20 * brake)},${Math.round(62 - 20 * brake)})` : '#c9533a';
    x.fillRect(pA[0], pA[1], w, h);
    x.restore();
  };
  lamp(0.015, 0.085, 0.58, 0.76);
  lamp(0.915, 0.985, 0.58, 0.76);

  // haze over horizon + vignette
  g = x.createLinearGradient(0, hy - 60, 0, hy + 80);
  g.addColorStop(0, 'rgba(205,180,135,0)'); g.addColorStop(0.5, 'rgba(205,180,135,0.18)'); g.addColorStop(1, 'rgba(205,180,135,0)');
  x.fillStyle = g; x.fillRect(0, hy - 60, W, 140);
  // bloom around the sun, over everything (it softly washes the van's roof edge too)
  x.save();
  x.globalCompositeOperation = 'screen';
  const bl = x.createRadialGradient(SUN_X, hy - 10, 0, SUN_X, hy - 10, 260);
  bl.addColorStop(0, 'rgba(255,224,170,0.5)'); bl.addColorStop(0.25, 'rgba(240,196,126,0.16)'); bl.addColorStop(1, 'rgba(240,196,126,0)');
  x.fillStyle = bl; x.fillRect(0, 0, W, H);
  x.restore();
  // split-tone grade: warm highlights up top, cool forest shadows below
  x.save();
  x.globalCompositeOperation = 'soft-light';
  const st = x.createLinearGradient(0, 0, 0, H);
  st.addColorStop(0, 'rgba(236,196,130,0.35)'); st.addColorStop(0.45, 'rgba(236,196,130,0.18)'); st.addColorStop(0.7, 'rgba(20,52,40,0.25)'); st.addColorStop(1, 'rgba(10,34,26,0.45)');
  x.fillStyle = st; x.fillRect(0, 0, W, H);
  x.restore();
  const vg = x.createRadialGradient(W * 0.6, H * 0.45, H * 0.3, W * 0.6, H * 0.45, H * 0.95);
  vg.addColorStop(0, 'rgba(8,18,12,0)'); vg.addColorStop(0.7, 'rgba(8,18,12,0.22)'); vg.addColorStop(1, 'rgba(8,18,12,0.55)');
  x.fillStyle = vg; x.fillRect(0, 0, W, H);
}
window.draw = draw;
draw(0);
</script></body></html>
